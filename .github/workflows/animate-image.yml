name: Animate Telegram Image

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Scene data from n8n"
        required: true
        type: string
      resumeUrl:
        description: "n8n callback URL"
        required: true
        type: string

jobs:
  animate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip
          python3 -m pip install --upgrade google-genai

      - name: Read scene data
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" > payload.json

          echo "Payload received"

          jq '{
            title,
            narration,
            music_mood,
            scene_count: (.scenes | length)
          }' payload.json

          COUNT=$(jq '.scenes | length' payload.json)

          if [ "$COUNT" -ne 15 ]; then
            echo "Expected 15 scenes but received $COUNT"
            exit 1
          fi

      - name: Generate HD scene images with Cloudflare + Pollinations + Pixazo fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
        run: |
          set -e
          mkdir -p scenes

          COUNT=$(jq '.scenes | length' payload.json)
          echo "Total scenes: $COUNT"

          if [ "$COUNT" -ne 15 ]; then
            echo "Expected 15 scenes but received $COUNT"
            exit 1
          fi

          CF_URL="https://api.cloudflare.com/client/v4/accounts/058021d96073d8aa330a8e9348a949ba/ai/run/@cf/black-forest-labs/flux-1-schnell"
          POLL_URL="https://gen.pollinations.ai/v1/images/generations"
          PIXAZO_URL="https://gateway.pixazo.ai/flux-1-schnell/v1/getData"

          for i in $(seq 0 $((COUNT - 1))); do

            NUMBER=$((i + 1))
            PROMPT=$(jq -r ".scenes[$i].image_prompt" payload.json)

            if [ -z "$PROMPT" ] || [ "$PROMPT" = "null" ]; then
              echo "Missing image prompt for scene $NUMBER"
              exit 1
            fi

            echo "======================================"
            echo "SCENE $NUMBER / $COUNT"
            echo "======================================"

            NORMAL_PROMPT="${PROMPT}. Family-friendly cinematic 3D animated film scene. Non-graphic and age-appropriate. Premium animation quality, detailed textures, professional cinematic lighting, vibrant natural colors, crisp focus, strong depth, vertical-friendly composition, centered main subject, no text, no watermark."

            SOURCE_READY=false
            USE_POLLINATIONS=false
            USE_PIXAZO=false

            # ==========================================
            # 1. CLOUDFLARE PRIMARY
            # ==========================================

            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then

              jq -n \
                --arg prompt "$NORMAL_PROMPT" \
                '{
                  prompt: $prompt,
                  steps: 8
                }' > "request_${NUMBER}.json"

              HTTP_CODE=$(curl -sS \
                -o "response_${NUMBER}.json" \
                -w "%{http_code}" \
                -X POST \
                "$CF_URL" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data @"request_${NUMBER}.json")

              echo "Cloudflare HTTP: $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then

                IMAGE_BASE64=$(jq -r \
                  '.result.image // empty' \
                  "response_${NUMBER}.json")

                if [ -n "$IMAGE_BASE64" ]; then
                  printf '%s' "$IMAGE_BASE64" \
                    | base64 --decode \
                    > "scenes/scene_${NUMBER}_source.jpg"

                  SOURCE_READY=true
                  echo "Cloudflare scene $NUMBER generated successfully"
                else
                  echo "Cloudflare returned no image."
                  USE_POLLINATIONS=true
                fi

              elif [ "$HTTP_CODE" = "429" ]; then

                echo "======================================"
                echo "CLOUDFLARE QUOTA EXHAUSTED"
                echo "Switching to Pollinations"
                echo "======================================"

                USE_POLLINATIONS=true

              else

                RESPONSE=$(cat "response_${NUMBER}.json")

                if echo "$RESPONSE" | grep -qiE 'NSFW|8007|unsafe|safety'; then

                  echo "Cloudflare safety filter triggered."
                  echo "Trying one neutral Cloudflare replacement."

                  SAFE_PROMPT="A peaceful family-friendly cinematic 3D animated environment for an educational YouTube story. Beautiful atmospheric scenery, warm cinematic lighting, colorful detailed surroundings, premium animated movie quality, crisp focus, strong depth, harmless age-appropriate imagery, vertical-friendly composition, centered visual subject, calm positive atmosphere, no text, no watermark."

                  jq -n \
                    --arg prompt "$SAFE_PROMPT" \
                    '{
                      prompt: $prompt,
                      steps: 8
                    }' > "safe_request_${NUMBER}.json"

                  SAFE_HTTP=$(curl -sS \
                    -o "safe_response_${NUMBER}.json" \
                    -w "%{http_code}" \
                    -X POST \
                    "$CF_URL" \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    -H "Content-Type: application/json" \
                    --data @"safe_request_${NUMBER}.json")

                  echo "Safe Cloudflare HTTP: $SAFE_HTTP"

                  if [ "$SAFE_HTTP" = "200" ]; then

                    SAFE_BASE64=$(jq -r \
                      '.result.image // empty' \
                      "safe_response_${NUMBER}.json")

                    if [ -n "$SAFE_BASE64" ]; then
                      printf '%s' "$SAFE_BASE64" \
                        | base64 --decode \
                        > "scenes/scene_${NUMBER}_source.jpg"

                      SOURCE_READY=true
                      echo "Safe Cloudflare scene $NUMBER generated successfully"
                    else
                      USE_POLLINATIONS=true
                    fi

                  else
                    echo "Cloudflare safe retry failed."
                    USE_POLLINATIONS=true
                  fi

                else
                  echo "Cloudflare failed."
                  USE_POLLINATIONS=true
                fi
              fi

            else
              echo "Cloudflare key missing."
              USE_POLLINATIONS=true
            fi

            # ==========================================
            # 2. POLLINATIONS FALLBACK
            # ==========================================

            if [ "$SOURCE_READY" != "true" ] && [ "$USE_POLLINATIONS" = "true" ]; then

              if [ -n "$POLLINATIONS_API_KEY" ]; then

                echo "Generating scene $NUMBER with Pollinations FLUX..."

                jq -n \
                  --arg prompt "$NORMAL_PROMPT" \
                  '{
                    prompt: $prompt,
                    model: "black-forest-labs/flux.1-schnell",
                    n: 1,
                    size: "1024x1024",
                    quality: "high",
                    response_format: "b64_json"
                  }' > "poll_request_${NUMBER}.json"

                POLL_HTTP=$(curl -sS \
                  -o "poll_response_${NUMBER}.json" \
                  -w "%{http_code}" \
                  -X POST \
                  "$POLL_URL" \
                  -H "Authorization: Bearer ${POLLINATIONS_API_KEY}" \
                  -H "Content-Type: application/json" \
                  --data @"poll_request_${NUMBER}.json")

                echo "Pollinations HTTP: $POLL_HTTP"

                if [ "$POLL_HTTP" = "200" ]; then

                  IMAGE_BASE64=$(jq -r \
                    '.data[0].b64_json // empty' \
                    "poll_response_${NUMBER}.json")

                  if [ -n "$IMAGE_BASE64" ]; then

                    printf '%s' "$IMAGE_BASE64" \
                      | base64 --decode \
                      > "scenes/scene_${NUMBER}_source.jpg"

                    SOURCE_READY=true
                    echo "Pollinations scene $NUMBER generated successfully"

                  else
                    echo "Pollinations returned no image."
                    USE_PIXAZO=true
                  fi

                else
                  echo "Pollinations failed for scene $NUMBER."
                  cat "poll_response_${NUMBER}.json" || true
                  echo "Switching to Pixazo."
                  USE_PIXAZO=true
                fi

              else
                echo "Pollinations key missing."
                USE_PIXAZO=true
              fi
            fi

            # ==========================================
            # 3. PIXAZO FALLBACK
            # ==========================================

            if [ "$SOURCE_READY" != "true" ]; then

              USE_PIXAZO=true

              if [ -z "$PIXAZO_API_KEY" ]; then
                echo "PIXAZO_API_KEY is missing"
                exit 1
              fi

              echo "======================================"
              echo "GENERATING SCENE $NUMBER WITH PIXAZO"
              echo "======================================"

              jq -n \
                --arg prompt "$NORMAL_PROMPT" \
                '{
                  prompt: $prompt,
                  num_steps: 4,
                  seed: 85131,
                  height: 1024,
                  width: 1024
                }' > "pixazo_request_${NUMBER}.json"

              PIXAZO_HTTP=$(curl -sS \
                -o "pixazo_response_${NUMBER}.json" \
                -w "%{http_code}" \
                -X POST \
                "$PIXAZO_URL" \
                -H "Content-Type: application/json" \
                -H "Cache-Control: no-cache" \
                -H "Ocp-Apim-Subscription-Key: ${PIXAZO_API_KEY}" \
                --data @"pixazo_request_${NUMBER}.json")

              echo "Pixazo HTTP: $PIXAZO_HTTP"

              if [ "$PIXAZO_HTTP" != "200" ]; then
                echo "Pixazo fallback failed for scene $NUMBER"
                cat "pixazo_response_${NUMBER}.json" || true
                exit 1
              fi

              PIXAZO_IMAGE_URL=$(jq -r \
                '.output // .image // .url // empty' \
                "pixazo_response_${NUMBER}.json")

              if [ -z "$PIXAZO_IMAGE_URL" ]; then
                echo "Pixazo returned no image URL for scene $NUMBER"
                cat "pixazo_response_${NUMBER}.json" || true
                exit 1
              fi

              curl -L --fail \
                "$PIXAZO_IMAGE_URL" \
                -o "scenes/scene_${NUMBER}_source.jpg"

              if [ ! -s "scenes/scene_${NUMBER}_source.jpg" ]; then
                echo "Pixazo image download failed for scene $NUMBER"
                exit 1
              fi

              SOURCE_READY=true
              echo "Pixazo scene $NUMBER generated successfully"
            fi

            # ==========================================
            # VALIDATE SOURCE IMAGE
            # ==========================================

            if [ "$SOURCE_READY" != "true" ] || [ ! -s "scenes/scene_${NUMBER}_source.jpg" ]; then
              echo "All image providers failed for scene $NUMBER"
              exit 1
            fi

            # ==========================================
            # FINAL 1080x1920 TELEGRAM IMAGE
            # ==========================================

            ffmpeg -y \
              -i "scenes/scene_${NUMBER}_source.jpg" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920" \
              -q:v 1 \
              "scenes/scene_${NUMBER}.jpg"

            if [ ! -s "scenes/scene_${NUMBER}.jpg" ]; then
              echo "Final image processing failed for scene $NUMBER"
              exit 1
            fi

            echo "SCENE $NUMBER READY"

          done

          echo "======================================"
          echo "ALL 15 TELEGRAM SCENES READY"
          echo "======================================"

      - name: Create Tamil narration with Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          jq -r '.narration' payload.json > narration.txt

          if [ ! -s narration.txt ]; then
            echo "Narration is empty"
            exit 1
          fi

          cat > generate_tts.py <<'PYTHON'
          import os
          import wave
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY is missing")

          with open("narration.txt", "r", encoding="utf-8") as f:
              narration = f.read().strip()

          if not narration:
              raise RuntimeError("Narration is empty")

          client = genai.Client(api_key=api_key)

          prompt = f"""
          Read the following transcript as a warm, natural Tamil female
          YouTube storyteller.

          Speak in authentic conversational spoken Tamil.
          Use clear native Tamil pronunciation.
          Sound friendly, bright, expressive and relaxed.
          Keep the delivery natural, like a Tamil YouTube creator
          telling an interesting story to viewers.
          Avoid a formal newsreader style.
          Avoid robotic delivery.
          Pronounce Tamil words naturally.
          English words appearing in the Tamil transcript should
          flow naturally inside the Tamil sentence.

          Transcript:
          {narration}
          """

          response = client.models.generate_content(
              model="gemini-2.5-flash-preview-tts",
              contents=prompt,
              config=types.GenerateContentConfig(
                  temperature=1,
                  response_modalities=["AUDIO"],
                  speech_config=types.SpeechConfig(
                      voice_config=types.VoiceConfig(
                          prebuilt_voice_config=types.PrebuiltVoiceConfig(
                              voice_name="Zephyr"
                          )
                      )
                  ),
              ),
          )

          audio_data = None

          for candidate in response.candidates or []:
              if not candidate.content:
                  continue

              for part in candidate.content.parts or []:
                  if part.inline_data and part.inline_data.data:
                      audio_data = part.inline_data.data
                      break

              if audio_data:
                  break

          if not audio_data:
              raise RuntimeError("Gemini TTS returned no audio data")

          with wave.open("narration_raw.wav", "wb") as wav_file:
              wav_file.setnchannels(1)
              wav_file.setsampwidth(2)
              wav_file.setframerate(24000)
              wav_file.writeframes(audio_data)

          print("Gemini Tamil narration generated successfully")
          PYTHON

          python3 generate_tts.py

          if [ ! -s narration_raw.wav ]; then
            echo "Gemini Tamil voice generation failed"
            exit 1
          fi

          ffmpeg -y \
            -i narration_raw.wav \
            -af "aresample=48000,loudnorm=I=-16:LRA=11:TP=-1.5" \
            -ar 48000 \
            -c:a libmp3lame \
            -b:a 192k \
            narration.mp3

          if [ ! -s narration.mp3 ]; then
            echo "Narration MP3 conversion failed"
            exit 1
          fi

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Narration duration: $VOICE_DURATION seconds"

      - name: Create individual scenes
        run: |
          COUNT=$(jq '.scenes | length' payload.json)

          mkdir -p clips

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          PER_SCENE_DURATION=$(awk \
            -v duration="$VOICE_DURATION" \
            -v count="$COUNT" \
            'BEGIN {
              printf "%.3f", (duration + 1.5) / count
            }')

          echo "Voice duration: $VOICE_DURATION"
          echo "Scene count: $COUNT"
          echo "Each scene duration: $PER_SCENE_DURATION"

          for i in $(seq 0 $((COUNT - 1))); do
            NUMBER=$((i + 1))

            echo "Rendering scene $NUMBER"

            ffmpeg -y \
              -loop 1 \
              -i "scenes/scene_${NUMBER}.jpg" \
              -t "$PER_SCENE_DURATION" \
              -vf "scale=1080:1920:flags=lanczos,setsar=1,fps=30,format=yuv420p" \
              -an \
              -c:v libx264 \
              -preset slow \
              -crf 18 \
              -profile:v high \
              -level 4.1 \
              -pix_fmt yuv420p \
              "clips/scene_${NUMBER}.mp4"
          done

      - name: Join scenes
        run: |
          rm -f concat.txt

          COUNT=$(jq '.scenes | length' payload.json)

          for i in $(seq 1 "$COUNT"); do
            echo "file 'clips/scene_${i}.mp4'" >> concat.txt
          done

          cat concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            video_no_audio.mp4

      - name: Add Tamil narration
        run: |
          TOTAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            video_no_audio.mp4)

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Video duration: $TOTAL_DURATION"
          echo "Voice duration: $VOICE_DURATION"

          ffmpeg -y \
            -i video_no_audio.mp4 \
            -i narration.mp3 \
            -filter_complex "[1:a]apad,atrim=duration=${TOTAL_DURATION}[audio]" \
            -map 0:v \
            -map "[audio]" \
            -t "$TOTAL_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -movflags +faststart \
            telegram-output.mp4

      - name: Check final Telegram video
        run: |
          if [ ! -s telegram-output.mp4 ]; then
            echo "Final Telegram video was not created"
            exit 1
          fi

          echo "Final Telegram video information"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_streams \
            telegram-output.mp4

      - name: Upload Telegram video artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-video
          path: telegram-output.mp4
          retention-days: 1

      - name: Resume n8n
        if: always()
        env:
          RESUME_URL: ${{ inputs.resumeUrl }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${{ job.status }}\"}" \
            "$RESUME_URL"
