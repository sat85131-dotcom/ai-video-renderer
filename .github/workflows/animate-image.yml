name: Animate Telegram Image

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Scene data from n8n"
        required: true
        type: string
      resumeUrl:
        description: "n8n callback URL"
        required: true
        type: string

jobs:
  animate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip
          python3 -m pip install --upgrade edge-tts

          echo "Available Tamil voices:"
          edge-tts --list-voices | grep "ta-IN" || true

      - name: Read scene data
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" > payload.json

          echo "Payload received"

          jq '{
            title,
            narration,
            music_mood,
            scene_count: (.scenes | length)
          }' payload.json

          COUNT=$(jq '.scenes | length' payload.json)

          if [ "$COUNT" -ne 15 ]; then
            echo "Expected 15 scenes but received $COUNT"
            exit 1
          fi

      - name: Generate scene images with Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p scenes

          COUNT=$(jq '.scenes | length' payload.json)

          echo "Total scenes: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "No scenes found"
            exit 1
          fi

          for i in $(seq 0 $((COUNT - 1))); do
            NUMBER=$((i + 1))
            PROMPT=$(jq -r ".scenes[$i].image_prompt" payload.json)

            if [ -z "$PROMPT" ] || [ "$PROMPT" = "null" ]; then
              echo "Missing image prompt for scene $NUMBER"
              exit 1
            fi

            echo "Generating scene $NUMBER of $COUNT"

            jq -n \
              --arg prompt "$PROMPT" \
              '{prompt: $prompt}' \
              > "request_${NUMBER}.json"

            curl -sS --fail \
              -X POST \
              "https://api.cloudflare.com/client/v4/accounts/058021d96073d8aa330a8e9348a949ba/ai/run/@cf/black-forest-labs/flux-1-schnell" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @"request_${NUMBER}.json" \
              -o "response_${NUMBER}.json"

            IMAGE_BASE64=$(jq -r '.result.image // empty' "response_${NUMBER}.json")

            if [ -z "$IMAGE_BASE64" ]; then
              echo "Cloudflare did not return an image for scene $NUMBER"
              cat "response_${NUMBER}.json"
              exit 1
            fi

            printf '%s' "$IMAGE_BASE64" | base64 --decode \
              > "scenes/scene_${NUMBER}.jpg"

            echo "Scene $NUMBER generated"
            file "scenes/scene_${NUMBER}.jpg"
          done

      - name: Create Tamil narration
        run: |
          jq -r '.narration' payload.json > narration.txt

          if [ ! -s narration.txt ]; then
            echo "Narration is empty"
            exit 1
          fi

          echo "Creating Tamil narration"

          edge-tts \
            --voice "ta-IN-PallaviNeural" \
            --rate="+0%" \
            --volume="+0%" \
            --pitch="+0Hz" \
            --file narration.txt \
            --write-media narration_raw.mp3

          if [ ! -s narration_raw.mp3 ]; then
            echo "Tamil voice generation failed"
            exit 1
          fi

          ffmpeg -y \
            -i narration_raw.mp3 \
            -af "aresample=48000,loudnorm=I=-16:LRA=11:TP=-1.5" \
            -ar 48000 \
            -c:a libmp3lame \
            -b:a 192k \
            narration.mp3

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Tamil narration created successfully"
          echo "Narration duration: $VOICE_DURATION seconds"

      - name: Create individual scenes
        run: |
          COUNT=$(jq '.scenes | length' payload.json)

          mkdir -p clips

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Voice duration: $VOICE_DURATION seconds"
          echo "Scene count: $COUNT"

          PER_SCENE_DURATION=$(awk \
            -v duration="$VOICE_DURATION" \
            -v count="$COUNT" \
            'BEGIN {
              printf "%.3f", (duration + 1.5) / count
            }')

          echo "Each scene duration: $PER_SCENE_DURATION seconds"

          for i in $(seq 0 $((COUNT - 1))); do
            NUMBER=$((i + 1))

            echo "Rendering scene $NUMBER"

            ffmpeg -y \
              -loop 1 \
              -i "scenes/scene_${NUMBER}.jpg" \
              -t "$PER_SCENE_DURATION" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=24,format=yuv420p" \
              -an \
              -c:v libx264 \
              -preset medium \
              -crf 24 \
              "clips/scene_${NUMBER}.mp4"
          done

      - name: Join scenes
        run: |
          rm -f concat.txt

          COUNT=$(jq '.scenes | length' payload.json)

          for i in $(seq 1 "$COUNT"); do
            echo "file 'clips/scene_${i}.mp4'" >> concat.txt
          done

          echo "Joining all scenes"
          cat concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            video_no_audio.mp4

      - name: Add Tamil narration
        run: |
          TOTAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            video_no_audio.mp4)

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Video duration: $TOTAL_DURATION"
          echo "Voice duration: $VOICE_DURATION"

          ffmpeg -y \
            -i video_no_audio.mp4 \
            -i narration.mp3 \
            -filter_complex "[1:a]apad,atrim=duration=${TOTAL_DURATION}[audio]" \
            -map 0:v \
            -map "[audio]" \
            -t "$TOTAL_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -movflags +faststart \
            output.mp4

      - name: Check final video
        run: |
          if [ ! -s output.mp4 ]; then
            echo "Final video was not created"
            exit 1
          fi

          echo "Final video information"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_streams \
            output.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-video
          path: output.mp4
          retention-days: 1

      - name: Resume n8n
        if: always()
        env:
          RESUME_URL: ${{ inputs.resumeUrl }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${{ job.status }}\"}" \
            "$RESUME_URL"
