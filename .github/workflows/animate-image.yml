name: Animate Telegram Image

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "AI image URL"
        required: true
        type: string
      resumeUrl:
        description: "n8n callback URL"
        required: true
        type: string

jobs:
  animate:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          curl -L --fail \
            -H "Authorization: Bearer ${{ secrets.POLLINATIONS_API_KEY }}" \
            "$IMAGE_URL" \
            -o input.jpg

          file input.jpg

      - name: Create cinematic animated video
        run: |
          ffmpeg -y \
            -loop 1 \
            -i input.jpg \
            -f lavfi -t 10 \
            -i "sine=frequency=110:sample_rate=44100" \
            -f lavfi -t 10 \
            -i "sine=frequency=220:sample_rate=44100" \
            -f lavfi -t 10 \
            -i "anoisesrc=color=pink:amplitude=0.015:sample_rate=44100" \
            -filter_complex "
            [0:v]
            scale=1300:2300:force_original_aspect_ratio=increase,
            crop=1300:2300,
            zoompan=
              z='1+0.16*(on/300)':
              x='iw/2-(iw/zoom/2)+18*sin(on/22)':
              y='ih/2-(ih/zoom/2)+14*cos(on/27)':
              d=300:
              s=1120x1992:
              fps=30,
            crop=1080:1920:
              x='20+10*sin(t*2.2)':
              y='36+8*cos(t*1.8)',
            eq=contrast=1.12:brightness=0.02:saturation=1.18,
            vignette=PI/5,
            noise=alls=5:allf=t,
            fade=t=in:st=0:d=0.6,
            fade=t=out:st=9.2:d=0.8,
            format=yuv420p
            [v];

            [1:a]volume=0.08[a1];
            [2:a]volume=0.035[a2];
            [3:a]volume=0.08,lowpass=f=1400[a3];

            [a1][a2][a3]
            amix=inputs=3:normalize=0,
            afade=t=in:st=0:d=1,
            afade=t=out:st=8.7:d=1.3,
            volume=0.9
            [a]
            " \
            -map "[v]" \
            -map "[a]" \
            -t 10 \
            -c:v libx264 \
            -preset medium \
            -crf 19 \
            -c:a aac \
            -b:a 160k \
            -movflags +faststart \
            output.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-video
          path: output.mp4
          retention-days: 1

      - name: Resume n8n
        if: always()
        env:
          RESUME_URL: ${{ inputs.resumeUrl }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${{ job.status }}\"}" \
            "$RESUME_URL"
