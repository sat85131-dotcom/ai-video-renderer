name: Animate Telegram Image

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Scene data from n8n"
        required: true
        type: string

      resumeUrl:
        description: "n8n callback URL"
        required: true
        type: string

jobs:
  animate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip
          pip install edge-tts

      - name: Read scene data
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" > payload.json

          echo "Payload:"
          jq '.' payload.json

      - name: Download scene images
        run: |
          mkdir -p scenes

          COUNT=$(jq '.image_urls | length' payload.json)

          echo "Total images: $COUNT"

          for i in $(seq 0 $((COUNT - 1))); do

            URL=$(jq -r ".image_urls[$i]" payload.json)
            NUMBER=$((i + 1))

            echo "Downloading scene $NUMBER"

            curl -L --fail \
              -H "Authorization: Bearer ${{ secrets.POLLINATIONS_API_KEY }}" \
              "$URL" \
              -o "scenes/scene_${NUMBER}.jpg"

            file "scenes/scene_${NUMBER}.jpg"

          done

      - name: Create storytelling voice
        run: |
          jq -r '.narration' payload.json > narration.txt

          echo "Narration:"
          cat narration.txt

          edge-tts \
            --voice en-US-AriaNeural \
            --rate="-5%" \
            --pitch="-2Hz" \
            --text "$(cat narration.txt)" \
            --write-media narration.mp3

          echo "Narration duration:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3

      - name: Create individual scenes
        run: |
          COUNT=$(jq '.scenes | length' payload.json)

          mkdir -p clips

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Voice duration: $VOICE_DURATION seconds"
          echo "Scene count: $COUNT"

          PER_SCENE_DURATION=$(awk \
            -v duration="$VOICE_DURATION" \
            -v count="$COUNT" \
            'BEGIN {
              printf "%.3f", (duration + 1.5) / count
            }')

          echo "Each scene duration: $PER_SCENE_DURATION seconds"

          for i in $(seq 0 $((COUNT - 1))); do

            NUMBER=$((i + 1))

            echo "Creating scene $NUMBER"

            ffmpeg -y \
              -loop 1 \
              -i "scenes/scene_${NUMBER}.jpg" \
              -t "$PER_SCENE_DURATION" \
              -vf "
              scale=1080:1920:force_original_aspect_ratio=increase,
              crop=1080:1920,
              fps=30,
              format=yuv420p
              " \
              -an \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              "clips/scene_${NUMBER}.mp4"

          done

      - name: Join scenes back to back
        run: |
          rm -f concat.txt

          COUNT=$(jq '.scenes | length' payload.json)

          for i in $(seq 1 "$COUNT"); do
            echo "file 'clips/scene_${i}.mp4'" >> concat.txt
          done

          echo "Scene list:"
          cat concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            video_no_audio.mp4

      - name: Add voice and optional BGM
        run: |
          TOTAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            video_no_audio.mp4)

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Video duration: $TOTAL_DURATION"
          echo "Voice duration: $VOICE_DURATION"

          if [ -f "bgm.mp3" ]; then

            echo "BGM found - mixing narration + BGM"

            ffmpeg -y \
              -i video_no_audio.mp4 \
              -i narration.mp3 \
              -stream_loop -1 \
              -i bgm.mp3 \
              -filter_complex "
              [1:a]
              volume=1.0,
              apad,
              atrim=duration=${TOTAL_DURATION}
              [voice];

              [2:a]
              volume=0.06,
              afade=t=in:st=0:d=2,
              apad,
              atrim=duration=${TOTAL_DURATION}
              [music];

              [voice][music]
              amix=inputs=2:duration=longest:normalize=0
              [audio]
              " \
              -map 0:v \
              -map "[audio]" \
              -t "$TOTAL_DURATION" \
              -c:v copy \
              -c:a aac \
              -b:a 160k \
              -movflags +faststart \
              output.mp4

          else

            echo "No bgm.mp3 found - using narration only"

            ffmpeg -y \
              -i video_no_audio.mp4 \
              -i narration.mp3 \
              -filter_complex "
              [1:a]
              volume=1.0,
              apad,
              atrim=duration=${TOTAL_DURATION}
              [audio]
              " \
              -map 0:v \
              -map "[audio]" \
              -t "$TOTAL_DURATION" \
              -c:v copy \
              -c:a aac \
              -b:a 160k \
              -movflags +faststart \
              output.mp4

          fi

      - name: Check final video
        run: |
          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_streams \
            output.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-video
          path: output.mp4
          retention-days: 1

      - name: Resume n8n
        if: always()
        env:
          RESUME_URL: ${{ inputs.resumeUrl }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${{ job.status }}\"}" \
            "$RESUME_URL"
