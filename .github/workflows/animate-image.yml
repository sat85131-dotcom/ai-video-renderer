name: Animate Telegram Image

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Scene data from n8n"
        required: true
        type: string
      resumeUrl:
        description: "n8n callback URL"
        required: true
        type: string

jobs:
  animate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip
          python3 -m pip install --upgrade google-genai

      - name: Read scene data
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" > payload.json

          echo "Payload received"

          jq '{
            title,
            narration,
            music_mood,
            scene_count: (.scenes | length)
          }' payload.json

          COUNT=$(jq '.scenes | length' payload.json)

          if [ "$COUNT" -ne 15 ]; then
            echo "Expected 15 scenes but received $COUNT"
            exit 1
          fi

      - name: Generate HD scene images with Cloudflare FLUX
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p scenes

          COUNT=$(jq '.scenes | length' payload.json)

          echo "Total scenes: $COUNT"

          if [ "$COUNT" -ne 15 ]; then
            echo "Expected 15 scenes but received $COUNT"
            exit 1
          fi

          for i in $(seq 0 $((COUNT - 1))); do

            NUMBER=$((i + 1))
            PROMPT=$(jq -r ".scenes[$i].image_prompt" payload.json)

            if [ -z "$PROMPT" ] || [ "$PROMPT" = "null" ]; then
              echo "Missing image prompt for scene $NUMBER"
              exit 1
            fi

            echo "======================================"
            echo "SCENE $NUMBER / $COUNT"
            echo "======================================"

            NORMAL_PROMPT="${PROMPT}. Family-friendly cinematic 3D animated film scene. Non-graphic and age-appropriate. Premium animation quality, highly detailed textures, professional cinematic lighting, vibrant natural colors, crisp focus, strong depth, vertical-friendly composition, centered main subject, no text, no watermark."

            jq -n \
              --arg prompt "$NORMAL_PROMPT" \
              '{
                prompt: $prompt,
                steps: 8
              }' > "request_${NUMBER}.json"

            HTTP_CODE=$(curl -sS \
              -o "response_${NUMBER}.json" \
              -w "%{http_code}" \
              -X POST \
              "https://api.cloudflare.com/client/v4/accounts/058021d96073d8aa330a8e9348a949ba/ai/run/@cf/black-forest-labs/flux-1-schnell" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @"request_${NUMBER}.json")

            echo "First attempt HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then

              RESPONSE=$(cat "response_${NUMBER}.json")

              if echo "$RESPONSE" | grep -qiE 'NSFW|8007|unsafe|safety'; then

                echo "Safety filter triggered on scene $NUMBER"
                echo "Original prompt will NOT be reused"
                echo "Generating completely neutral replacement"

                SAFE_PROMPT="A peaceful family-friendly cinematic 3D animated landscape for an educational YouTube story. Beautiful atmospheric environment, warm cinematic lighting, colorful detailed surroundings, premium animated movie quality, crisp sharp focus, strong depth, harmless age-appropriate imagery, vertical-friendly composition, centered visual subject, calm positive atmosphere, no text, no watermark."

                jq -n \
                  --arg prompt "$SAFE_PROMPT" \
                  '{
                    prompt: $prompt,
                    steps: 8
                  }' > "safe_request_${NUMBER}.json"

                SAFE_HTTP=$(curl -sS \
                  -o "safe_response_${NUMBER}.json" \
                  -w "%{http_code}" \
                  -X POST \
                  "https://api.cloudflare.com/client/v4/accounts/058021d96073d8aa330a8e9348a949ba/ai/run/@cf/black-forest-labs/flux-1-schnell" \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data @"safe_request_${NUMBER}.json")

                echo "Neutral replacement HTTP: $SAFE_HTTP"

                if [ "$SAFE_HTTP" = "200" ]; then
                  cp "safe_response_${NUMBER}.json" \
                     "response_${NUMBER}.json"

                  HTTP_CODE="200"

                  echo "Neutral replacement SUCCESS"
                else
                  echo "Neutral replacement failed"
                  cat "safe_response_${NUMBER}.json"
                  exit 1
                fi

              else
                echo "Cloudflare failed for a non-safety reason"
                cat "response_${NUMBER}.json"
                exit 1
              fi

            fi

            IMAGE_BASE64=$(jq -r \
              '.result.image // empty' \
              "response_${NUMBER}.json")

            if [ -z "$IMAGE_BASE64" ]; then
              echo "Cloudflare returned no image for scene $NUMBER"
              cat "response_${NUMBER}.json"
              exit 1
            fi

            printf '%s' "$IMAGE_BASE64" \
              | base64 --decode \
              > "scenes/scene_${NUMBER}_source.jpg"

            if [ ! -s "scenes/scene_${NUMBER}_source.jpg" ]; then
              echo "Image decode failed for scene $NUMBER"
              exit 1
            fi

            ffmpeg -y \
              -i "scenes/scene_${NUMBER}_source.jpg" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920" \
              -q:v 1 \
              "scenes/scene_${NUMBER}.jpg"

            if [ ! -s "scenes/scene_${NUMBER}.jpg" ]; then
              echo "Final image processing failed for scene $NUMBER"
              exit 1
            fi

            echo "SCENE $NUMBER READY"

          done

          echo "======================================"
          echo "ALL 15 SCENES GENERATED SUCCESSFULLY"
          echo "======================================"

      - name: Create Tamil narration with Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          jq -r '.narration' payload.json > narration.txt

          if [ ! -s narration.txt ]; then
            echo "Narration is empty"
            exit 1
          fi

          cat > generate_tts.py <<'PYTHON'
          import os
          import wave
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY is missing")

          with open("narration.txt", "r", encoding="utf-8") as f:
              narration = f.read().strip()

          if not narration:
              raise RuntimeError("Narration is empty")

          client = genai.Client(api_key=api_key)

          prompt = f"""
          Read the following transcript as a warm, natural Tamil female
          YouTube storyteller.

          Speak in authentic conversational spoken Tamil.
          Use clear native Tamil pronunciation.
          Sound friendly, bright, expressive and relaxed.
          Keep the delivery natural, like a Tamil YouTube creator
          telling an interesting story to viewers.
          Avoid a formal newsreader style.
          Avoid robotic delivery.
          Pronounce Tamil words naturally.
          English words appearing in the Tamil transcript should
          flow naturally inside the Tamil sentence.

          Transcript:
          {narration}
          """

          response = client.models.generate_content(
              model="gemini-2.5-flash-preview-tts",
              contents=prompt,
              config=types.GenerateContentConfig(
                  temperature=1,
                  response_modalities=["AUDIO"],
                  speech_config=types.SpeechConfig(
                      voice_config=types.VoiceConfig(
                          prebuilt_voice_config=types.PrebuiltVoiceConfig(
                              voice_name="Zephyr"
                          )
                      )
                  ),
              ),
          )

          audio_data = None

          for candidate in response.candidates or []:
              if not candidate.content:
                  continue

              for part in candidate.content.parts or []:
                  if part.inline_data and part.inline_data.data:
                      audio_data = part.inline_data.data
                      break

              if audio_data:
                  break

          if not audio_data:
              raise RuntimeError("Gemini TTS returned no audio data")

          with wave.open("narration_raw.wav", "wb") as wav_file:
              wav_file.setnchannels(1)
              wav_file.setsampwidth(2)
              wav_file.setframerate(24000)
              wav_file.writeframes(audio_data)

          print("Gemini Tamil narration generated successfully")
          PYTHON

          python3 generate_tts.py

          if [ ! -s narration_raw.wav ]; then
            echo "Gemini Tamil voice generation failed"
            exit 1
          fi

          ffmpeg -y \
            -i narration_raw.wav \
            -af "aresample=48000,loudnorm=I=-16:LRA=11:TP=-1.5" \
            -ar 48000 \
            -c:a libmp3lame \
            -b:a 192k \
            narration.mp3

          if [ ! -s narration.mp3 ]; then
            echo "Narration MP3 conversion failed"
            exit 1
          fi

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Narration duration: $VOICE_DURATION seconds"

      - name: Create individual scenes
        run: |
          COUNT=$(jq '.scenes | length' payload.json)

          mkdir -p clips

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          PER_SCENE_DURATION=$(awk \
            -v duration="$VOICE_DURATION" \
            -v count="$COUNT" \
            'BEGIN {
              printf "%.3f", (duration + 1.5) / count
            }')

          echo "Voice duration: $VOICE_DURATION"
          echo "Scene count: $COUNT"
          echo "Each scene duration: $PER_SCENE_DURATION"

          for i in $(seq 0 $((COUNT - 1))); do
            NUMBER=$((i + 1))

            echo "Rendering scene $NUMBER"

            ffmpeg -y \
              -loop 1 \
              -i "scenes/scene_${NUMBER}.jpg" \
              -t "$PER_SCENE_DURATION" \
              -vf "scale=1080:1920:flags=lanczos,setsar=1,fps=30,format=yuv420p" \
              -an \
              -c:v libx264 \
              -preset slow \
              -crf 18 \
              -profile:v high \
              -level 4.1 \
              -pix_fmt yuv420p \
              "clips/scene_${NUMBER}.mp4"
          done

      - name: Join scenes
        run: |
          rm -f concat.txt

          COUNT=$(jq '.scenes | length' payload.json)

          for i in $(seq 1 "$COUNT"); do
            echo "file 'clips/scene_${i}.mp4'" >> concat.txt
          done

          cat concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            video_no_audio.mp4

      - name: Add Tamil narration
        run: |
          TOTAL_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            video_no_audio.mp4)

          VOICE_DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            narration.mp3)

          echo "Video duration: $TOTAL_DURATION"
          echo "Voice duration: $VOICE_DURATION"

          ffmpeg -y \
            -i video_no_audio.mp4 \
            -i narration.mp3 \
            -filter_complex "[1:a]apad,atrim=duration=${TOTAL_DURATION}[audio]" \
            -map 0:v \
            -map "[audio]" \
            -t "$TOTAL_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -movflags +faststart \
            output.mp4

      - name: Check final video
        run: |
          if [ ! -s output.mp4 ]; then
            echo "Final video was not created"
            exit 1
          fi

          echo "Final video information"

          ffprobe \
            -v error \
            -show_entries format=duration,size,bit_rate \
            -show_streams \
            output.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: animated-video
          path: output.mp4
          retention-days: 1

      - name: Resume n8n
        if: always()
        env:
          RESUME_URL: ${{ inputs.resumeUrl }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${{ job.status }}\"}" \
            "$RESUME_URL"
