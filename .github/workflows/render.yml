name: Render AI Video

on:
  workflow_dispatch:
    inputs:
      scenes_json:
        description: "Scenes JSON"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python3 -m pip install --upgrade edge-tts
          python3 -m pip install openai-whisper

      - name: Save scenes JSON
        env:
          SCENES_JSON: ${{ inputs.scenes_json }}
        run: |
          printf '%s' "$SCENES_JSON" > scenes.json
          python3 -m json.tool scenes.json

      - name: Render all scenes
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import asyncio
          import edge_tts
          import whisper

          with open("scenes.json", "r", encoding="utf-8") as f:
              scenes = json.load(f)

          os.makedirs("segments", exist_ok=True)

          print("Loading Whisper model...")
          whisper_model = whisper.load_model("tiny")
          print("Whisper ready")

          def ass_time(seconds):
              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              secs = seconds % 60
              return f"{hours}:{minutes:02d}:{secs:05.2f}"

          def escape_ass(text):
              return (
                  str(text)
                  .replace("\\", r"\\")
                  .replace("{", r"\{")
                  .replace("}", r"\}")
                  .replace("\n", " ")
                  .strip()
              )

          async def make_voice(text, output):
              communicate = edge_tts.Communicate(
                  text=text,
                  voice="ta-IN-PallaviNeural",
                  rate="+0%"
              )

              await communicate.save(output)

          def get_word_timings(audio_file):

              result = whisper_model.transcribe(
                  audio_file,
                  language="ta",
                  task="transcribe",
                  word_timestamps=True,
                  fp16=False
              )

              words = []

              for segment in result.get("segments", []):
                  for word in segment.get("words", []):
                      text = word.get("word", "").strip()

                      if not text:
                          continue

                      words.append({
                          "text": text,
                          "start": float(word["start"]),
                          "end": float(word["end"])
                      })

              return words

          def create_ass(words, output_file):

              lines = [
                  "[Script Info]",
                  "ScriptType: v4.00+",
                  "PlayResX: 1080",
                  "PlayResY: 1920",
                  "WrapStyle: 2",
                  "ScaledBorderAndShadow: yes",
                  "",
                  "[V4+ Styles]",
                  "Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding",
                  "Style: Default,Noto Sans Tamil,68,&H00FFFFFF,&H00FFFFFF,&H00000000,&H70000000,-1,0,0,0,100,100,0,0,1,5,1,2,70,70,330,1",
                  "",
                  "[Events]",
                  "Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text"
              ]

              chunk_size = 4

              for index, word in enumerate(words):

                  group_start = (index // chunk_size) * chunk_size
                  group_end = min(
                      group_start + chunk_size,
                      len(words)
                  )

                  group = words[group_start:group_end]

                  display_words = []

                  for local_index, item in enumerate(group):

                      real_index = group_start + local_index
                      safe_word = escape_ass(item["text"])

                      if real_index == index:
                          display_words.append(
                              r"{\1c&H0000FF00&\b1}" +
                              safe_word +
                              r"{\1c&H00FFFFFF&\b1}"
                          )
                      else:
                          display_words.append(
                              r"{\1c&H00FFFFFF&\b1}" +
                              safe_word
                          )

                  caption = " ".join(display_words)

                  start = word["start"]

                  if index + 1 < len(words):
                      end = words[index + 1]["start"]
                  else:
                      end = word["end"] + 0.10

                  if end <= start:
                      end = start + 0.10

                  lines.append(
                      f"Dialogue: 0,"
                      f"{ass_time(start)},"
                      f"{ass_time(end)},"
                      f"Default,,0,0,0,,"
                      f"{{\\an2}}{caption}"
                  )

              with open(
                  output_file,
                  "w",
                  encoding="utf-8-sig"
              ) as f:
                  f.write("\n".join(lines))

          segment_files = []

          for i, scene in enumerate(scenes, start=1):

              number = str(i).zfill(2)

              video_url = scene.get("video_url")
              voice_text = scene.get("voice_text", "").strip()

              if not video_url:
                  raise RuntimeError(
                      f"Scene {i}: video_url missing"
                  )

              if not voice_text:
                  raise RuntimeError(
                      f"Scene {i}: voice_text missing"
                  )

              source_video = (
                  f"segments/source_{number}.mp4"
              )

              voice_file = (
                  f"segments/voice_{number}.mp3"
              )

              subtitle_file = os.path.abspath(
                  f"segments/subtitle_{number}.ass"
              )

              output_file = (
                  f"segments/scene_{number}.mp4"
              )

              print("==============================")
              print(f"SCENE {i}")
              print("==============================")

              print("Downloading video...")

              subprocess.run([
                  "curl",
                  "-L",
                  "--fail",
                  "--retry", "3",
                  "--retry-delay", "2",
                  video_url,
                  "-o",
                  source_video
              ], check=True)

              print("Generating Tamil female voice...")

              asyncio.run(
                  make_voice(
                      voice_text,
                      voice_file
                  )
              )

              print("Getting Whisper word timestamps...")

              words = get_word_timings(
                  voice_file
              )

              print(
                  f"Scene {i}: "
                  f"{len(words)} caption words"
              )

              if len(words) == 0:
                  raise RuntimeError(
                      f"Scene {i}: Whisper returned no words"
                  )

              print("Creating green-highlight captions...")

              create_ass(
                  words,
                  subtitle_file
              )

              duration = subprocess.check_output([
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  voice_file
              ]).decode().strip()

              duration = float(duration)

              print(
                  f"Voice duration: "
                  f"{duration:.2f}s"
              )

              subtitle_filter = (
                  f"subtitles='{subtitle_file}':"
                  "fontsdir='/usr/share/fonts'"
              )

              video_filter = (
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "fps=30,"
                  "eq=contrast=1.05:"
                  "saturation=1.08:"
                  "brightness=0.01,"
                  + subtitle_filter +
                  ",format=yuv420p"
              )

              print("Rendering scene...")

              subprocess.run([
                  "ffmpeg",
                  "-y",

                  "-stream_loop", "-1",
                  "-i", source_video,

                  "-i", voice_file,

                  "-t", str(duration),

                  "-vf", video_filter,

                  "-map", "0:v:0",
                  "-map", "1:a:0",

                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "22",

                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-ar", "48000",
                  "-ac", "2",

                  "-movflags", "+faststart",

                  output_file
              ], check=True)

              segment_files.append(
                  output_file
              )

          with open(
              "segments.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for segment in segment_files:
                  f.write(
                      "file '" +
                      os.path.abspath(segment) +
                      "'\n"
                  )

          print("ALL SCENES READY")
          PY

      - name: Join scenes
        run: |
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i segments.txt \
            -c copy \
            -movflags +faststart \
            final.mp4

      - name: Check final video
        run: |
          echo "===== FINAL VIDEO ====="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
