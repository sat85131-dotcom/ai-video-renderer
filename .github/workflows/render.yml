name: Render AI Video

on:
  workflow_dispatch:
    inputs:
      scenes_json:
        description: "Scenes JSON"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --upgrade edge-tts

      - name: Save scenes JSON
        env:
          SCENES_JSON: ${{ inputs.scenes_json }}
        run: |
          printf '%s' "$SCENES_JSON" > scenes.json
          python3 -m json.tool scenes.json

      - name: Render all scenes
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import asyncio
          import edge_tts

          with open("scenes.json", "r", encoding="utf-8") as f:
              scenes = json.load(f)

          os.makedirs("segments", exist_ok=True)

          async def make_voice(text, output):
              communicate = edge_tts.Communicate(
                  text=text,
                  voice="en-US-AriaNeural",
                  rate="+5%"
              )
              await communicate.save(output)

          def srt_time(seconds):
              ms = int((seconds % 1) * 1000)
              total = int(seconds)

              hours = total // 3600
              minutes = (total % 3600) // 60
              secs = total % 60

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{ms:03d}"
              )

          def create_simple_srt(text, duration, output_file):
              words = text.split()

              if not words:
                  return

              chunk_size = 4

              chunks = [
                  words[i:i + chunk_size]
                  for i in range(0, len(words), chunk_size)
              ]

              chunk_duration = duration / len(chunks)

              lines = []

              for i, chunk in enumerate(chunks, start=1):
                  start = (i - 1) * chunk_duration
                  end = min(i * chunk_duration, duration)

                  lines.append(str(i))
                  lines.append(
                      f"{srt_time(start)} --> {srt_time(end)}"
                  )
                  lines.append(" ".join(chunk))
                  lines.append("")

              with open(
                  output_file,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("\n".join(lines))

          segment_files = []

          for i, scene in enumerate(scenes, start=1):

              number = str(i).zfill(2)

              video_url = scene.get("video_url")
              voice_text = scene.get("voice_text", "").strip()

              if not video_url:
                  raise RuntimeError(
                      f"Scene {i}: video_url missing"
                  )

              if not voice_text:
                  raise RuntimeError(
                      f"Scene {i}: voice_text missing"
                  )

              source_video = (
                  f"segments/source_{number}.mp4"
              )

              voice_file = (
                  f"segments/voice_{number}.mp3"
              )

              subtitle_file = os.path.abspath(
                  f"segments/subtitle_{number}.srt"
              )

              output_file = (
                  f"segments/scene_{number}.mp4"
              )

              print("==========================")
              print(f"SCENE {i}")
              print("==========================")

              print("Downloading clip...")

              subprocess.run([
                  "curl",
                  "-L",
                  "--fail",
                  "--retry", "3",
                  "--retry-delay", "2",
                  video_url,
                  "-o",
                  source_video
              ], check=True)

              print("Generating English voice...")

              asyncio.run(
                  make_voice(
                      voice_text,
                      voice_file
                  )
              )

              duration = subprocess.check_output([
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  voice_file
              ]).decode().strip()

              duration = float(duration)

              print(
                  f"Voice duration: {duration:.2f}s"
              )

              create_simple_srt(
                  voice_text,
                  duration,
                  subtitle_file
              )

              subtitle_filter = (
                  f"subtitles='{subtitle_file}':"
                  "force_style='"
                  "FontName=DejaVu Sans,"
                  "FontSize=20,"
                  "PrimaryColour=&H00FFFFFF,"
                  "OutlineColour=&H00000000,"
                  "BorderStyle=1,"
                  "Outline=3,"
                  "Shadow=1,"
                  "Alignment=2,"
                  "MarginV=250'"
              )

              video_filter = (
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "fps=30,"
                  "eq=contrast=1.06:"
                  "saturation=1.10:"
                  "brightness=0.01,"
                  + subtitle_filter +
                  ",format=yuv420p"
              )

              print("Rendering scene...")

              subprocess.run([
                  "ffmpeg",
                  "-y",

                  "-stream_loop", "-1",
                  "-i", source_video,

                  "-i", voice_file,

                  "-t", str(duration),

                  "-vf", video_filter,

                  "-map", "0:v:0",
                  "-map", "1:a:0",

                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "22",

                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-ar", "48000",
                  "-ac", "2",

                  "-movflags", "+faststart",

                  output_file
              ], check=True)

              segment_files.append(
                  output_file
              )

          with open(
              "segments.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for segment in segment_files:
                  f.write(
                      "file '" +
                      os.path.abspath(segment) +
                      "'\n"
                  )

          print("ALL SCENES RENDERED")
          PY

      - name: Join scenes
        run: |
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i segments.txt \
            -c copy \
            -movflags +faststart \
            final.mp4

      - name: Check final video
        run: |
          echo "===== FINAL VIDEO ====="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
