name: Render AI Video

on:
  workflow_dispatch:
    inputs:
      scenes_json:
        description: "Scenes JSON"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-extra
          python3 -m pip install --upgrade edge-tts
          python3 -m pip install openai-whisper

      - name: Save scenes JSON
        env:
          SCENES_JSON: ${{ inputs.scenes_json }}
        run: |
          printf '%s' "$SCENES_JSON" > scenes.json
          python3 -m json.tool scenes.json

      - name: Render all scenes
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import asyncio
          import edge_tts
          import whisper

          with open("scenes.json", "r", encoding="utf-8") as f:
              scenes = json.load(f)

          os.makedirs("segments", exist_ok=True)

          print("Loading Whisper model...")
          whisper_model = whisper.load_model("tiny")
          print("Whisper ready")

          async def make_voice(text, output):
              communicate = edge_tts.Communicate(
                  text=text,
                  voice="ta-IN-PallaviNeural",
                  rate="+5%"
              )
              await communicate.save(output)

          def ass_time(seconds):
              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              secs = seconds % 60
              return f"{hours}:{minutes:02d}:{secs:05.2f}"

          def escape_ass(text):
              return (
                  str(text)
                  .replace("\\", r"\\")
                  .replace("{", r"\{")
                  .replace("}", r"\}")
                  .replace("\n", " ")
                  .strip()
              )

          def get_word_timings(audio_file):
              result = whisper_model.transcribe(
                  audio_file,
                  language="ta",
                  task="transcribe",
                  word_timestamps=True,
                  fp16=False
              )

              words = []

              for segment in result.get("segments", []):
                  for word in segment.get("words", []):
                      text = word.get("word", "").strip()

                      if not text:
                          continue

                      words.append({
                          "text": text,
                          "start": float(word["start"]),
                          "end": float(word["end"])
                      })

              return words

          def create_ass(words, output_file):
              lines = [
                  "[Script Info]",
                  "ScriptType: v4.00+",
                  "PlayResX: 1080",
                  "PlayResY: 1920",
                  "WrapStyle: 2",
                  "ScaledBorderAndShadow: yes",
                  "",
                  "[V4+ Styles]",
                  "Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding",
                  "Style: Default,Noto Sans Tamil,68,&H00FFFFFF,&H00FFFFFF,&H00000000,&H70000000,-1,0,0,0,100,100,0,0,1,5,1,2,70,70,300,1",
                  "",
                  "[Events]",
                  "Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text"
              ]

              chunk_size = 4

              for index, word in enumerate(words):
                  group_start = (index // chunk_size) * chunk_size
                  group_end = min(
                      group_start + chunk_size,
                      len(words)
                  )

                  group = words[group_start:group_end]
                  display_words = []

                  for local_index, item in enumerate(group):
                      actual_index = group_start + local_index
                      safe_word = escape_ass(item["text"])

                      if actual_index == index:
                          display_words.append(
                              r"{\1c&H0000FF00&\b1}" +
                              safe_word +
                              r"{\1c&H00FFFFFF&\b1}"
                          )
                      else:
                          display_words.append(
                              r"{\1c&H00FFFFFF&\b1}" +
                              safe_word
                          )

                  caption = " ".join(display_words)
                  start = word["start"]

                  if index + 1 < len(words):
                      end = words[index + 1]["start"]
                  else:
                      end = word["end"] + 0.10

                  if end <= start:
                      end = start + 0.10

                  lines.append(
                      f"Dialogue: 0,"
                      f"{ass_time(start)},"
                      f"{ass_time(end)},"
                      f"Default,,0,0,0,,"
                      f"{{\\an2}}{caption}"
                  )

              with open(
                  output_file,
                  "w",
                  encoding="utf-8-sig"
              ) as f:
                  f.write("\n".join(lines))

          segment_files = []

          for i, scene in enumerate(scenes, start=1):
              number = str(i).zfill(2)

              video_url = scene.get("video_url")
              voice_text = scene.get(
                  "voice_text",
                  ""
              ).strip()

              if not video_url:
                  raise RuntimeError(
                      f"Scene {i}: video_url missing"
                  )

              if not voice_text:
                  raise RuntimeError(
                      f"Scene {i}: voice_text missing"
                  )

              source_video = f"segments/source_{number}.mp4"
              voice_file = f"segments/voice_{number}.mp3"

              subtitle_file = os.path.abspath(
                  f"segments/subtitle_{number}.ass"
              )

              output_file = f"segments/scene_{number}.mp4"

              print("==========================")
              print(f"SCENE {i}")
              print("==========================")

              print("Downloading clip...")

              subprocess.run([
                  "curl",
                  "-L",
                  "--fail",
                  "--retry", "3",
                  "--retry-delay", "2",
                  video_url,
                  "-o",
                  source_video
              ], check=True)

              print("Generating Tamil voice...")

              asyncio.run(
                  make_voice(
                      voice_text,
                      voice_file
                  )
              )

              print("Getting exact word timings...")

              words = get_word_timings(
                  voice_file
              )

              print(
                  f"Scene {i}: {len(words)} words detected"
              )

              if len(words) == 0:
                  raise RuntimeError(
                      f"Scene {i}: Whisper returned no words"
                  )

              print("Creating green captions...")

              create_ass(
                  words,
                  subtitle_file
              )

              duration = subprocess.check_output([
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  voice_file
              ]).decode().strip()

              duration = float(duration)

              print(
                  f"Voice duration: {duration:.2f}s"
              )

              subtitle_filter = (
                  f"subtitles='{subtitle_file}':"
                  "fontsdir='/usr/share/fonts'"
              )

              # Add a subtle cinematic zoom so stock footage feels less static.
              # Keep it gentle to avoid motion sickness and preserve caption readability.
              zoom_filter = (
                  "zoompan="
                  "z='min(zoom+0.0008,1.06)':"
                  "x='iw/2-(iw/zoom/2)':"
                  "y='ih/2-(ih/zoom/2)':"
                  "d=1:"
                  "s=1080x1920:"
                  "fps=30,"
              )

              video_filter = (
                  "scale=1080:1920:"
                  "force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  + zoom_filter +
                  "eq=contrast=1.06:"
                  "saturation=1.10:"
                  "brightness=0.01,"
                  + subtitle_filter +
                  ",format=yuv420p"
              )

              print("Rendering scene...")

              subprocess.run([
                  "ffmpeg",
                  "-y",

                  "-stream_loop", "-1",
                  "-i", source_video,

                  "-i", voice_file,

                  "-t", str(duration),

                  "-vf", video_filter,

                  "-map", "0:v:0",
                  "-map", "1:a:0",

                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "22",

                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-ar", "48000",
                  "-ac", "2",

                  "-movflags", "+faststart",

                  output_file
              ], check=True)

              segment_files.append(
                  output_file
              )

          print("ALL SCENES RENDERED")
          PY

      - name: Join scenes with dynamic transitions
        run: |
          python3 <<'PY'
          import glob
          import subprocess
          import shutil

          scenes = sorted(
              glob.glob("segments/scene_*.mp4")
          )

          if not scenes:
              raise RuntimeError(
                  "No rendered scene files found"
              )

          if len(scenes) == 1:
              shutil.copyfile(
                  scenes[0],
                  "final.mp4"
              )
              raise SystemExit(0)

          durations = []

          for scene in scenes:
              duration = subprocess.check_output([
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  scene
              ]).decode().strip()

              durations.append(
                  float(duration)
              )

          transition_duration = min(
              0.25,
              min(durations) / 3
          )

          print("Scene durations:")

          for i, duration in enumerate(
              durations,
              start=1
          ):
              print(
                  f"Scene {i}: {duration:.2f}s"
              )

          print(
              "Transition duration:",
              transition_duration
          )

          command = [
              "ffmpeg",
              "-y"
          ]

          for scene in scenes:
              command.extend([
                  "-i",
                  scene
              ])

          filters = []

          for i in range(len(scenes)):
              filters.append(
                  f"[{i}:v]"
                  f"settb=AVTB,"
                  f"setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )

              filters.append(
                  f"[{i}:a]"
                  f"asetpts=PTS-STARTPTS"
                  f"[a{i}]"
              )

          running_duration = durations[0]

          video_left = "v0"
          audio_left = "a0"

          for i in range(1, len(scenes)):
              video_output = f"vx{i}"
              audio_output = f"ax{i}"

              offset = (
                  running_duration -
                  transition_duration
              )

              filters.append(
                  f"[{video_left}]"
                  f"[v{i}]"
                  f"xfade="
                  f"transition=fade:"
                  f"duration={transition_duration:.3f}:"
                  f"offset={offset:.3f}"
                  f"[{video_output}]"
              )

              filters.append(
                  f"[{audio_left}]"
                  f"[a{i}]"
                  f"acrossfade="
                  f"d={transition_duration:.3f}:"
                  f"c1=tri:"
                  f"c2=tri"
                  f"[{audio_output}]"
              )

              running_duration = (
                  running_duration +
                  durations[i] -
                  transition_duration
              )

              video_left = video_output
              audio_left = audio_output

          filter_complex = ";".join(
              filters
          )

          command.extend([
              "-filter_complex",
              filter_complex,

              "-map",
              f"[{video_left}]",

              "-map",
              f"[{audio_left}]",

              "-c:v",
              "libx264",

              "-preset",
              "veryfast",

              "-crf",
              "22",

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-ar",
              "48000",

              "-ac",
              "2",

              "-movflags",
              "+faststart",

              "final.mp4"
          ])

          print(
              "Rendering final video with dynamic transitions..."
          )

          subprocess.run(
              command,
              check=True
          )

          print(
              "FINAL TRANSITION VIDEO READY"
          )
          PY

      - name: Add background music with voice ducking
        run: |
          python3 <<'PY'
          import subprocess
          import urllib.request
          import os

          MUSIC_URL = "https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b04e5.mp3"

          print("Downloading background music...")

          try:
              urllib.request.urlretrieve(
                  MUSIC_URL,
                  "background.mp3"
              )

          except Exception as e:
              print(
                  "Music download failed:",
                  e
              )

              print(
                  "Keeping video without background music."
              )

              raise SystemExit(0)

          duration = subprocess.check_output([
              "ffprobe",
              "-v", "error",
              "-show_entries",
              "format=duration",
              "-of",
              "default=noprint_wrappers=1:nokey=1",
              "final.mp4"
          ]).decode().strip()

          duration = float(duration)

          print(
              f"Final video duration: {duration:.2f}s"
          )

          filter_complex = (
              "[1:a]"
              "volume=0.12,"
              f"atrim=0:{duration},"
              "asetpts=PTS-STARTPTS"
              "[music];"

              "[0:a]"
              "asplit=2"
              "[voice][sidechain];"

              "[music]"
              "[sidechain]"
              "sidechaincompress="
              "threshold=0.02:"
              "ratio=8:"
              "attack=20:"
              "release=350"
              "[ducked];"

              "[voice]"
              "[ducked]"
              "amix="
              "inputs=2:"
              "duration=first:"
              "dropout_transition=2,"
              "alimiter=limit=0.95"
              "[mixed]"
          )

          subprocess.run([
              "ffmpeg",
              "-y",

              "-i",
              "final.mp4",

              "-stream_loop",
              "-1",

              "-i",
              "background.mp3",

              "-filter_complex",
              filter_complex,

              "-map",
              "0:v:0",

              "-map",
              "[mixed]",

              "-c:v",
              "copy",

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-ar",
              "48000",

              "-ac",
              "2",

              "-shortest",

              "-movflags",
              "+faststart",

              "final_music.mp4"

          ], check=True)

          os.replace(
              "final_music.mp4",
              "final.mp4"
          )

          print(
              "BACKGROUND MUSIC + VOICE DUCKING READY"
          )
          PY

      - name: Add hook impact SFX
        run: |
          echo "Creating hook impact SFX..."

          ffmpeg -y \
            -f lavfi \
            -i "anoisesrc=color=white:duration=0.45:amplitude=0.15" \
            -af "highpass=f=180,lowpass=f=2200,afade=t=out:st=0.08:d=0.37,volume=0.35" \
            -ar 48000 \
            -ac 2 \
            whoosh.wav

          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=75:duration=0.35:sample_rate=48000" \
            -af "afade=t=out:st=0:d=0.35,volume=0.55" \
            -ar 48000 \
            -ac 2 \
            thump.wav

          ffmpeg -y \
            -i whoosh.wav \
            -i thump.wav \
            -filter_complex "[0:a][1:a]amix=inputs=2:duration=longest:normalize=0,alimiter=limit=0.90[sfx]" \
            -map "[sfx]" \
            -ar 48000 \
            -ac 2 \
            hook_sfx.wav

          ffmpeg -y \
            -i final.mp4 \
            -i hook_sfx.wav \
            -filter_complex "[1:a]volume=0.55[sfx];[0:a][sfx]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[aout]" \
            -map 0:v:0 \
            -map "[aout]" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -ac 2 \
            -movflags +faststart \
            final_sfx.mp4

          mv final_sfx.mp4 final.mp4

          echo "HOOK IMPACT SFX READY"

      - name: Fix final video compatibility
        run: |
          echo "Fixing MP4 for mobile, browser and YouTube playback..."

          ffmpeg -y \
            -fflags +genpts \
            -i final.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            -profile:v high \
            -level 4.1 \
            -r 30 \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -ac 2 \
            -movflags +faststart \
            final_fixed.mp4

          mv final_fixed.mp4 final.mp4

          echo "PLAYBACK COMPATIBILITY FIXED"

      - name: Check final video
        run: |
          echo "===== FINAL VIDEO ====="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
