name: Render AI Video

on:
  workflow_dispatch:
    inputs:
      scenes_json:
        description: "Scenes JSON"
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python3 -m pip install openai-whisper

      - name: Check edge-tts version
        run: |
          edge-tts --version

      - name: Test Tamil subtitles
        run: |
          edge-tts \
            --voice "ta-IN-PallaviNeural" \
            --text "வணக்கம் நண்பர்களே இன்று ஒரு அருமையான விஷயத்தை பார்க்கலாம்" \
            --write-media test.mp3 \
            --write-subtitles test.srt

          echo "===== SUBTITLE TEST ====="
          cat test.srt

          echo "===== AUDIO DURATION ====="
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            test.mp3
      - name: Upload test files
        uses: actions/upload-artifact@v4
        with:
          name: tamil-tts-test
          path: |
            test.mp3
            test.srt
