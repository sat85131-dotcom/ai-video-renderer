name: Render AI Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python3 -m pip install --upgrade edge-tts
          python3 -m pip install openai-whisper

      - name: Check tools
        run: |
          edge-tts --version
          whisper --help > /dev/null
          ffmpeg -version | head -n 1

      - name: Generate Tamil female voice
        run: |
          edge-tts \
            --voice "ta-IN-PallaviNeural" \
            --text "வணக்கம் நண்பர்களே இன்று ஒரு அருமையான விஷயத்தை பார்க்கலாம்" \
            --write-media test.mp3

          echo "===== MP3 CREATED ====="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            test.mp3

      - name: Generate Tamil subtitles with Whisper
        run: |
          whisper test.mp3 \
            --model tiny \
            --language Tamil \
            --task transcribe \
            --output_format srt \
            --output_dir .

          echo "===== WHISPER SUBTITLE ====="

          if [ -f test.srt ]; then
            cat test.srt
          else
            echo "ERROR: test.srt was not created"
            exit 1
          fi

      - name: Upload test files
        uses: actions/upload-artifact@v4
        with:
          name: tamil-voice-caption-test
          path: |
            test.mp3
            test.srt
